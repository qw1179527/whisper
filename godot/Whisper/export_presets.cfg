; ⚠ **C# 项目必须用 mono 专用导出模板**（2026-10-07 实测）
; 现象：`--export-debug` 报
;   No export template found at the expected path:
;     /root/.local/share/godot/export_templates/**4.4.stable.mono**/android_debug.apk
; 而标准模板装在 `4.4.stable/` 下（非 mono），Godot 找的是带 `.mono` 后缀的目录。
; ⇒ 需要 `Godot_v4.4-stable_mono_export_templates.tpz`（1.07 GB），
;   解到 rootfs 的 `~/.local/share/godot/export_templates/4.4.stable.mono/`。
; 顺带记下：该错误会**连带报一条 TFM 错误**
;   （`Unable to determine the C# project's TFM`），而实际 csproj 是标准的 `net8.0` ——
;   用 GDScript 诊断脚本核实过：`dotnet/project/assembly_name=Whisper`、
;   `Whisper.csproj`/`Whisper.sln` 都在。⇒ **TFM 报错是模板缺失的连带症状，不是独立问题。**

