<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>低语计划 · 灰盒可玩端 v1</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b0b0c; overflow: hidden; height: 100%;
                font-family: 'Courier New', 'Noto Serif SC', monospace; -webkit-user-select: none; user-select: none; }
  #gl { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #hud button { pointer-events: auto; }
  #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
          color: #F0E6D2; background: #0b0b0c; text-align: center; padding: 24px; }
  #boot h1 { font-size: 22px; letter-spacing: 0.24em; font-weight: 700; margin: 0 0 6px; }
  #boot p { font-size: 12px; color: #D8CFBB; line-height: 1.9; max-width: 420px; }
  #boot button { margin-top: 20px; background: transparent; color: #F0E6D2; border: 1px solid rgba(240,230,210,0.42);
                 padding: 12px 20px; font-size: 13px; letter-spacing: 0.12em; font-family: inherit; }

<body>
<canvas id="gl"></canvas>
<div id="hud"></div>
<div id="boot">
  <h1>低语计划 · 灰盒</h1>
  <p>疗养院 · 单人验证局（M0 机制验证，非完整体验）</p>
  <p style="color:#5C8C6E">拾取全部 5 份证据后前往撤离点。手电会有声音，说话会被听见——<br>「声纹即风险」。</p>
  <button id="startBtn">开始（将请求麦克风权限）</button>
  <small id="bootMsg" style="color:#5C8C6E">就绪</small>
  <small id="bootOrigin" style="color:rgba(240,230,210,0.34)"></small>
  <small>触屏：左半屏拖动 = 移动，右半屏拖动 = 转视角<br>桌面：WASD + Shift 跑 + Ctrl 蹲，鼠标拖动转视角</small>
</div>
<script>
  // PROBE-1：不依赖任何外部资源的自检。
  // 若这行文字出现而"开始"仍无反应，说明 JS 能跑、问题在模块加载；
  // 若这行文字都不出现，说明脚本被整体拦截（WebView 策略/缓存了旧页）。
  (function () {
    var el = document.getElementById("bootMsg");
    if (el) el.textContent = "自检：脚本已执行 · " + location.origin;
    fetch("/healthz", { cache: "no-store" }).then(function (r) { return r.text(); }).then(function (t) {
      if (el) el.textContent += " · 同源可达";
    }).catch(function (e) {
      if (el) el.textContent += " · 同源不可达(" + e.message + ")";
    });
  })();
</script>

    if (msg) msg.textContent = "自检：脚本已执行 · 单文件包 " + (typeof window.startGame === "function" ? "已加载" : "未加载");
    var btn = document.getElementById("startBtn");
    if (!btn) { __fail("绑定开始按钮", new Error("找不到 #startBtn")); return; }
    btn.addEventListener("click", function () {
      var boot = document.getElementById("boot");
      if (boot) boot.style.display = "none";
      try {
        if (typeof window.startGame !== "function") throw new Error("单文件包未导出 startGame");
        Promise.resolve(window.startGame()).catch(function (e) { __fail("startGame 异步失败", e); });
      } catch (e) { __fail("startGame 同步抛错", e); }
    }, { once: true });
  })();
</script>
</body>
