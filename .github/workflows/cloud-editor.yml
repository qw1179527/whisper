# 云上 Unity Editor —— **手机浏览器点开就能用**，用户零操作
#
# ## 它解决什么
# 用户要"和 PC 等价开发"。手机上本地跑 Unity 要么拿不到文件（Unity 中国镜像没有 Linux/ARM64 版），
# 要么要叠 Wine + box64 两层模拟（慢 10~30 倍）。而 **GitHub Actions 的 runner 本来就是
# 一台免费的 x86_64 Linux**（4 核 / 16 GB / 清盘后约 30 GB）—— Unity 在上面**原生运行、零翻译**。
#
# ## 它是怎么做到"用户不动手"的
# ```
# 智能体：POST /actions/workflows/cloud-editor.yml/dispatches   ← 令牌驱动，无需点网页
#   runner：装 Unity → 起 Xvfb + x11vnc + noVNC → 开 cloudflared 隧道 → 打印公网网址
# 智能体：从日志里抓出那个网址，发给用户
# 用户：  在手机浏览器点开网址                    ← 唯一动作，就是"点一下"
# ```
# **不需要注册 Codespaces、不需要配 secret、不需要建账号** —— cloudflared 的快速隧道免账号。
#
# ## ⚠️ 必须说清楚的两件事
# 1. **这是把 Actions 当交互式开发机用**。GitHub 的 AUP 期望 Actions 用于"与该项目软件的生产/
#    测试/部署/发布相关的活动"。**本项目正是这个仓库的软件开发**，用途上说得通；但它毕竟不是
#    Codespaces 那种被设计来干这事的形态。**如果长期重度依赖，正规做法是迁到 Codespaces。**
# 2. **单次最长 6 小时**（GitHub 硬上限），到点会被回收。适合"集中开发一段时间"，
#    不适合挂着当常驻开发机。
#
# ## 性能现实（别期望错）
# · CPU：**x86_64 原生** —— 这是它相对"手机本地跑"的根本优势（那边要 box64 翻译）
# · GPU：**没有** → Mesa llvmpipe 软件渲染，Scene View 会卡；编辑/播放逻辑/出包都可用
# · 出包：在 runner 上跑，速度接近真 PC（**比 CI 那套 Docker 镜像还快，因为没有镜像拉取**）
name: cloud-editor

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: '保持多少分钟（上限 340，远小于 GitHub 6 小时硬限）'
        required: false
        default: '180'
      project:
        description: '要打开的工程路径'
        required: false
        default: 'unity'

permissions:
  contents: write        # ★ 自动存档要把改动推回仓库（runner 是临时的，不推就丢）
  issues: write          # 用 issue 评论发网址（第二条通道，防日志取不到）

jobs:
  editor:
    name: 云上 Unity Editor（浏览器可用）
    runs-on: ubuntu-latest
    timeout-minutes: 355          # 略低于 6 小时硬限，留出收尾时间
    steps:
      - name: 释放 runner 磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          # ⚠️ 这五个参数**全是承重的**，别再"优化"掉：
          # 实测把 tool-cache/haskell/large-packages 改 false 后构建报
          # `failed to register layer: no space left on device`。
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - name: 诊断磁盘
        run: |
          echo "=== 清盘后可用空间 ==="
          df -h / | tail -1
          AVAIL=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "可用：${AVAIL} GB（Unity 编辑器解压约 5 GB + Android 模块约 4 GB）"
          if [ "${AVAIL:-0}" -lt 15 ]; then
            echo "::error title=空间不足::清盘后仅 ${AVAIL} GB，装不下 Unity"; exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 自动存档要能 push

      # Library 缓存：与 unity-android.yml **共用同一 key 前缀** → 两边互相预热。
      # 不缓存的话，每次云会话都要重新导入全部资产，起步就白等十几分钟。
      - name: 缓存 Library
        uses: actions/cache@v4
        with:
          path: unity/Library
          key: Library-Android-v2-${{ hashFiles('unity/Assets/**', 'unity/ProjectSettings/**') }}
          restore-keys: Library-Android-v2-

      - name: 装显示栈与工具
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            xvfb x11vnc novnc websockify \
            mesa-utils libgl1-mesa-dri libglu1-mesa libvulkan1 mesa-vulkan-drivers \
            xz-utils ca-certificates curl
          # cloudflared 快速隧道：免费、**不需要账号**，给一个随机 trycloudflare.com 域名
          sudo curl -fL -o /usr/local/bin/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo chmod +x /usr/local/bin/cloudflared
          echo "✓ 显示栈 + cloudflared 就绪（$(cloudflared --version 2>&1 | head -1)）"

      - name: 下载并解压 Unity Linux 编辑器
        run: |
          set -e
          VER=6000.3.25f1; HASH=e1dba0a9aba4
          BASE="https://download.unity3d.com/download_unity/${HASH}"
          mkdir -p dl
          echo "=== 下载编辑器（约 4.2 GB，runner 走全球 CDN）==="
          time curl -fL --retry 3 --retry-delay 3 -o dl/editor.tar.xz \
            "${BASE}/LinuxEditorInstaller/Unity-${VER}.tar.xz"
          S=$(stat -c%s dl/editor.tar.xz)
          test "$S" -eq 4536554312 || { echo "::error::体积不符 $S"; exit 1; }
          echo "✓ 4.2 GB 完整"
          sudo mkdir -p /opt/unity
          echo "=== 解压 ==="
          time sudo tar -xJf dl/editor.tar.xz -C /opt/unity
          test -x /opt/unity/Editor/Unity || { echo "::error::解压后没有 /opt/unity/Editor/Unity"; exit 1; }
          echo "✓ $(du -sh /opt/unity | cut -f1)"

      - name: Android Build Support（出包必需）
        run: |
          set -e
          VER=6000.3.25f1; HASH=e1dba0a9aba4
          BASE="https://download.unity3d.com/download_unity/${HASH}"
          # Linux 模块的命名有几种历史形态，逐个试 —— 猜一个不如都试一遍
          for cand in \
            "${BASE}/UnitySetup-Android-Support-for-Editor-${VER}.tar.xz" \
            "${BASE}/LinuxEditorTargetInstaller/UnitySetup-Android-Support-for-Editor-${VER}.tar.xz" \
            "${BASE}/TargetSupportInstaller/UnitySetup-Android-Support-for-Editor-${VER}.tar.xz" ; do
            echo "试：$(basename "$cand")"
            if curl -fL -sS -o dl/android.tar.xz "$cand" 2>/dev/null; then
              SZ=$(stat -c%s dl/android.tar.xz 2>/dev/null || echo 0)
              if [ "$SZ" -gt 10000000 ]; then
                sudo tar -xJf dl/android.tar.xz -C /opt/unity && { echo "✓ Android 模块已装"; exit 0; }
              fi
            fi
          done
          echo "::warning title=Android 模块未装::Editor 仍可用（编辑/播放），但**不能出包**"

      - name: 装 Unity 许可证
        env:
          UL: ${{ secrets.UNITY_LICENSE }}
          US: ${{ secrets.UNITY_SERIAL }}
        run: |
          set -e
          LICDIR="$HOME/.local/share/unity3d/Unity"
          mkdir -p "$LICDIR"
          if [ -n "$UL" ]; then
            printf '%s' "$UL" > "$LICDIR/Unity_lic.ulf"
            echo "✓ 许可证已写入（来自 secret UNITY_LICENSE，$(stat -c%s "$LICDIR/Unity_lic.ulf") 字节）"
          elif [ -n "$US" ]; then
            echo "::warning::只有 UNITY_SERIAL 没有 UNITY_LICENSE —— Editor 启动时可能需要手动登录"
          else
            echo "::warning title=无许可证::没有 UNITY_LICENSE secret —— Editor 起来后需要手动激活"
          fi

      - name: 起图形界面 + 隧道，并打印网址
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          set -e
          # 软件渲染：runner 没有 GPU
          export LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe
          # ── VNC 密码：**必须恰好 8 位**（实测踩过的坑）──────────────────────
          # RFB（VNC）协议的经典 DES 认证**只取密码前 8 个字符**，x11vnc 也照此截断。
          # 我第一版生成了 10 位 → 服务端只认前 8 位，而网址里传的是全部 10 位
          # → 浏览器报 `password check failed!`。**不是密码错，是长度超了被截断。**
          # 所以这里固定 8 位；并且**不再用 `-rfbauth <(storepasswd ...)` 那种进程替换写法**
          # （太脆：`/dev/stdout` 在子 shell 里指向的是日志，写进去的是垃圾）。
          VNCPW=$(head -c 16 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 8)
          # 双保险：长度不对就报错，别让它带着坏密码跑起来
          if [ "${#VNCPW}" -ne 8 ]; then echo "::error::VNC 密码不是 8 位（${#VNCPW}）"; exit 1; fi
          echo "VNCPW=$VNCPW" >> $GITHUB_ENV

          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset > /tmp/xvfb.log 2>&1 &
          sleep 3
          # 只用 `-passwd` 这个最直接的形态；-forever 保证断开后还能再连
          x11vnc -display :99 -forever -shared -passwd "$VNCPW" -rfbport 5900 > /tmp/x11vnc.log 2>&1 &
          sleep 3
          # 起完立刻自检：端口在听吗？密码长度对吗？（防"看起来起来了实际连不上"）
          if command -v ss >/dev/null 2>&1; then ss -ltnp 2>/dev/null | grep -q ':5900' && echo "✓ x11vnc 在 5900 监听" || echo "::warning::5900 没在监听"; fi
          echo "✓ VNC 密码已设为 ${#VNCPW} 位（RFB 上限就是 8）"
          grep -iE "error|fail|denied" /tmp/x11vnc.log | head -3 || echo "  x11vnc 日志无错误"
          websockify --web=/usr/share/novnc/ 6080 localhost:5900 > /tmp/novnc.log 2>&1 &
          sleep 2

          cloudflared tunnel --url http://localhost:6080 --no-autoupdate > /tmp/cf.log 2>&1 &
          echo "=== 等隧道 URL（最多 90 秒）==="
          for i in $(seq 1 45); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log 2>/dev/null | head -1)
            [ -n "$URL" ] && break
            sleep 2
          done
          if [ -z "$URL" ]; then
            echo "::error title=隧道失败::cloudflared 没给出 URL"; tail -30 /tmp/cf.log; exit 1
          fi

          # 启动 Unity Editor（软件渲染，首次打开工程慢）
          if [ -x /opt/unity/Editor/Unity ]; then
            (cd "$GITHUB_WORKSPACE" && DISPLAY=:99 /opt/unity/Editor/Unity \
              -projectPath "$GITHUB_WORKSPACE/$PROJECT" > /tmp/unity.log 2>&1 &)
            echo "✓ Unity Editor 已启动（日志 /tmp/unity.log）"
          fi

          # ★ 把网址打成显眼的一行 —— 智能体会从日志里抓它
          echo ""
          echo "████████████████████████████████████████████████████████████"
          echo "██  CLOUD_EDITOR_URL = ${URL}/vnc.html?autoconnect=1&resize=scale&password=${VNCPW}"
          echo "██  （在手机浏览器直接打开上面这个地址）"
          echo "████████████████████████████████████████████████████████████"
          echo ""
          FULL_URL="${URL}/vnc.html?autoconnect=1&resize=scale&password=${VNCPW}"
          {
            echo "## 云上 Unity Editor 已就绪"
            echo ""
            echo "**打开这个地址：**"
            echo ""
            echo '```'
            echo "$FULL_URL"
            echo '```'
            echo ""
            echo "软件渲染（无 GPU），Scene View 会卡；编辑/播放/出包正常。"
          } >> $GITHUB_STEP_SUMMARY

          # ── 三条通道同时发，防"网址拿不到"（实测：进行中的作业**取不到日志**，
          #    GitHub 要等作业结束才生成日志 blob → 而本作业要保活几小时，等不起）──
          # 通道 1：落盘，供下一步【立刻】上传为 artifact（最可靠）
          printf '%s\n' "$FULL_URL" > "$GITHUB_WORKSPACE/cloud-editor-url.txt"
          echo "已写 cloud-editor-url.txt"
          # 通道 2：issue 评论（评论可被 API 立即读取）
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            ISSUE=$(curl -fsS -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues" \
              -d "{\"title\":\"☁️ 云上 Unity Editor 已就绪（run ${GITHUB_RUN_ID}）\",\"body\":\"打开这个地址：\\n\\n\\`\\`\\`\\n${FULL_URL}\\n\\`\\`\\`\\n\\n软件渲染（无 GPU），Scene View 会卡；编辑/播放/出包正常。\\n\\n（本条由工作流自动创建，用完可关）\"}" \
              | grep -o '"number":[0-9]*' | head -1 | cut -d: -f2) || true
            echo "issue 评论/创建结果编号: ${ISSUE:-失败}"
          fi

      # ★ 这一步必须紧跟"打印网址"，**不能等到作业结束** ——
      #   实测：进行中的作业取不到日志（blob 要作业结束才生成），而本作业保活几小时。
      #   产物一上传就能下载，所以这是拿到网址最可靠的通道。
      - name: 立刻上传网址（artifact）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-editor-url
          path: cloud-editor-url.txt
          if-no-files-found: error
          retention-days: 3

      - name: 保持会话（心跳 + 保活）
        env:
          MINUTES: ${{ inputs.minutes }}
        run: |
          set -u
          M=${MINUTES:-180}
          [ "$M" -gt 340 ] && M=340
          # ── 自动存档：runner 是【临时】的，作业结束里面的一切都没了。
          #    不自动推的话，"改了 3 小时、作业到点、全丢"是最容易吃的亏。
          #    推到**独立会话分支**而不是 main —— 会话里的改动是半成品，
          #    不该污染主线；等会话结束再由人（或智能体）审阅合并。
          BRANCH="cloud-editor/session-${GITHUB_RUN_ID}"
          ##########################################################################
          # 【关于这台机器上"你自己看不到自己改动"的重要说明】
          #   Actions runner 上的工作区是**一次性的**：作业结束即销毁。
          #   所以本步骤每 5 分钟自动 commit + push 到上面那个分支。
          #   云端编辑器里改完东西，**不需要手动 git 操作** —— 等着自动存档即可；
          #   想立刻存档就在 Editor 外开个终端跑一次本步骤同款命令（见日志）。
          ##########################################################################
          autosave() {
            cd "$GITHUB_WORKSPACE" || return 0
            # 只在真的有改动时才提交（空提交会刷屏）
            if [ -n "$(git status --porcelain 2>/dev/null)" ]; then
              git add -A 2>/dev/null
              git -c user.email="cloud-editor@users.noreply.github.com" \
                  -c user.name="cloud-editor (auto)" \
                  commit -q -m "cloud-editor 自动存档 $(date -u +%Y-%m-%dT%H:%M:%SZ) [run ${GITHUB_RUN_ID}]" 2>/dev/null || return 0
              if git push -q origin "HEAD:${BRANCH}" 2>/dev/null; then
                echo "  💾 已存档并推送到 ${BRANCH}（$(git rev-parse --short HEAD)）"
              else
                echo "  ⚠ 存档提交成功但推送失败（下次会重试；本地提交仍在工作区）"
              fi
            fi
          }

          echo "保持 ${M} 分钟…（每 5 分钟自动存档到 ${BRANCH}）"
          for i in $(seq 1 "$M"); do
            sleep 60
            if [ $((i % 5)) -eq 0 ]; then autosave; fi
            if [ $((i % 15)) -eq 0 ]; then
              echo "[$i/${M} 分] 存活检查：Xvfb=$(pgrep -c Xvfb || echo 0) · x11vnc=$(pgrep -c x11vnc || echo 0) · novnc=$(pgrep -c websockify || echo 0) · Unity=$(pgrep -c -f '/opt/unity/Editor/Unity' || echo 0) · 磁盘剩余=$(df -h / | tail -1 | awk '{print $4}')"
              # 隧道断了就重连（长时间会话里这是最常见的故障）
              if ! pgrep -f 'cloudflared tunnel' >/dev/null; then
                echo "  ⚠ cloudflared 掉了，重连…"
                cloudflared tunnel --url http://localhost:6080 --no-autoupdate > /tmp/cf2.log 2>&1 &
              fi
            fi
          done
          echo "到时收工"

      - name: 收尾：最后一次自动存档
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          BRANCH="cloud-editor/session-${GITHUB_RUN_ID}"
          if [ -n "$(git status --porcelain 2>/dev/null)" ]; then
            git add -A 2>/dev/null
            git -c user.email="cloud-editor@users.noreply.github.com" \
                -c user.name="cloud-editor (auto)" \
                commit -q -m "cloud-editor 收尾存档 $(date -u +%Y-%m-%dT%H:%M:%SZ) [run ${GITHUB_RUN_ID}]" 2>/dev/null || true
            git push -q origin "HEAD:${BRANCH}" 2>/dev/null && echo "✓ 已推送到 ${BRANCH}" || echo "⚠ 推送失败，改动仅存在于即将销毁的工作区"
          else
            echo "无改动"
          fi
          {
            echo "## 本次会话的存档分支"
            echo ""
            echo '```'
            echo "$BRANCH"
            echo '```'
            echo ""
            echo "会话里的一切改动都在这个分支上（每 5 分钟自动存档一次）。"
          } >> $GITHUB_STEP_SUMMARY

      - name: 收尾：导出 Unity 日志（便于排查）
        if: always()
        run: |
          tail -200 /tmp/unity.log > unity-editor-tail.log 2>/dev/null || echo "(无 Unity 日志)" > unity-editor-tail.log
          tail -50 /tmp/cf.log >> unity-editor-tail.log 2>/dev/null || true

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-editor-logs
          path: unity-editor-tail.log
          if-no-files-found: warn
          retention-days: 7
