# 从 Unity 官方发行物中提取「手机端可用的工具链」
#
# ── 结论已经拿到（#2 那轮）──────────────────────────────────
#   ① 引用程序集 ✅  `Editor/Data/Managed/UnityEngine/*.dll`（真 Unity 程序集）
#   ② **il2cpp 是托管的** ✅✅  `file` 判定为 `Mono/.Net assembly`：
#        Unity.IL2CPP.dll · Unity.IL2CPP.DataModel.dll · Unity.IL2CPP.Common35.dll
#      "Intel 80386/Windows" 只是 PE 头元数据（AnyCPU 汇编都这样标），代码是 **IL**。
#      实证：同目录有 `il2cpp-compile.dll` + `.runtimeconfig.json` + `.deps.json`
#      —— 这是 **.NET 应用**的标配三件套，`il2cpp-compile`（无扩展名）是 **apphost**。
#      ⇒ 手机 .NET 8 **有可能直接跑** `dotnet il2cpp-compile.dll`（待实测）。
#   ③ Android 模块 ❌ 解压路径错乱（`TargetSupport.pkg.tmpTargetSupport.pkg.tmp/…` 层层嵌套）→ 本轮暂不取
#
# ── 版本历史（两轮教训都留着）─────────────────────────────
#   v1 用 Windows NSIS 安装包 → 7z 在 Linux 上也解不开，且失败被 `||` 吞掉 →
#      "工作流 success 但产物 306 字节"的**假绿**。
#   v2 换 **Linux tar.xz**（`tar -xJ` 直接解）+ 加硬判据 → 提取成功、硬判据通过，
#      但**打包步骤**被 Android 模块的畸形深路径拖炸。
#   v3（本版）只取 ①②；打包收窄并排除 .pdb；仍保留全部硬判据。
name: extract-unity-tools

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-unity-tools.yml'

jobs:
  extract:
    name: 提取 Unity 工具链
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - name: 下载 Linux 编辑器 tarball（纯 tar.xz，4.2GB）
        run: |
          set -e
          mkdir -p dl
          time curl -fL --retry 3 --retry-delay 5 -o dl/editor.tar.xz \
            "https://download.unity3d.com/download_unity/e1dba0a9aba4/LinuxEditorInstaller/Unity-6000.3.25f1.tar.xz"
          S=$(stat -c%s dl/editor.tar.xz)
          test "$S" -eq 4536554312 || { echo "::error::体积不符：$S"; exit 1; }
          echo "✓ 4.2GB 下载完成"

      - name: 解压（只取 Managed 与 il2cpp 两棵子树）
        run: |
          set -e
          mkdir -p out
          tar -xJf dl/editor.tar.xz -C out \
            --wildcards 'Editor/Data/Managed/*' 'Editor/Data/il2cpp/*' 2>/dev/null || true
          echo "== 规模 =="
          du -sh out/Editor/Data/Managed out/Editor/Data/il2cpp 2>/dev/null
          echo "== Managed dll =="
          find out -path "*Managed*" -name "*.dll" | wc -l
          echo "== il2cpp 文件 =="
          find out -path "*il2cpp*" -type f | wc -l

      - name: 硬判据（防假绿）
        run: |
          set -e
          D=$(find out -path "*Managed*" -name "*.dll" | wc -l)
          I=$(find out -path "*il2cpp*" -type f | wc -l)
          echo "Managed dll=$D · il2cpp 文件=$I"
          test "$D" -gt 0 || { echo "::error::没拿到引用程序集"; exit 1; }
          test "$I" -gt 0 || { echo "::error::没拿到 il2cpp"; exit 1; }
          # 关键三件套必须在（它们决定"手机能否跑 il2cpp"）
          for f in il2cpp-compile.dll il2cpp-compile.runtimeconfig.json il2cpp-compile.deps.json Unity.IL2CPP.dll; do
            find out -name "$f" | head -1 | grep -q . || { echo "::error::缺关键文件 $f"; exit 1; }
            echo "  ✓ $f"
          done
          echo "✓ 硬判据通过"

      - name: 诊断清单
        run: |
          set +e
          mkdir -p diag
          {
            echo "# Unity 工具链诊断（v3）"
            echo
            echo "## il2cpp 关键文件与类型判定"
            echo '```'
            find out -path "*il2cpp/build/deploy*" -maxdepth 12 -type f \
              \( -name "il2cpp*" -o -name "Unity.IL2CPP*.dll" \) 2>/dev/null | sort | head -30 | while read f; do
              printf '%s\n   %s\n   %s 字节\n' "$f" "$(file -b "$f")" "$(stat -c%s "$f")"
            done
            echo '```'
            echo "## il2cpp-compile.runtimeconfig.json 内容（决定手机 .NET 版本能否跑它）"
            echo '```json'
            find out -name "il2cpp-compile.runtimeconfig.json" -exec cat {} \; 2>/dev/null
            echo '```'
            echo "## 引用程序集（前 20）"
            echo '```'
            find out -path "*Managed/UnityEngine*" -name "*.dll" 2>/dev/null | sort | head -20
            echo '```'
            echo "Managed/UnityEngine dll 总数: $(find out -path '*Managed/UnityEngine*' -name '*.dll' 2>/dev/null | wc -l)"
            echo
            echo "## libil2cpp 源码目录"
            echo '```'
            find out -type d -name libil2cpp 2>/dev/null | head -3
            ls out/Editor/Data/il2cpp/libil2cpp 2>/dev/null | head -15
            echo '```'
            echo "## 体积"
            echo '```'
            du -h --max-depth=5 out 2>/dev/null | sort -rh | head -15
            echo '```'
          } > diag/report.md 2>&1
          find out -type f -printf '%s\t%p\n' 2>/dev/null | sort -rn > diag/inventory.tsv
          echo "report $(wc -l < diag/report.md) 行 · inventory $(wc -l < diag/inventory.tsv) 行"
          sed -n '1,50p' diag/report.md

      - name: 打包（收窄 + 排除 .pdb/.xml，保证小而可靠）
        run: |
          set -e
          mkdir -p ship
          # ① il2cpp 工具（含 apphost 三件套 + 托管 DLL）
          find out -path "*il2cpp/build/deploy*" -type f \
            ! -name "*.pdb" ! -name "*.xml" -exec cp --parents {} ship/ \; 2>/dev/null || true
          # ② libil2cpp 源码（交叉编译要用）
          if [ -d out/Editor/Data/il2cpp/libil2cpp ]; then
            mkdir -p ship/libil2cpp && cp -r out/Editor/Data/il2cpp/libil2cpp/. ship/libil2cpp/ 2>/dev/null || true
          fi
          # ③ 引用程序集（只要 UnityEngine*，不要 UnityEditor*，省一半体积）
          find out -path "*Managed/UnityEngine*" -name "UnityEngine*.dll" \
            -exec cp --parents {} ship/ \; 2>/dev/null || true
          du -sh ship/* 2>/dev/null
          tar -czf unity-tools.tar.gz -C ship . 2>/dev/null
          S=$(stat -c%s unity-tools.tar.gz)
          echo "unity-tools.tar.gz = $S 字节（$((S/1048576)) MB）"
          test "$S" -gt 1048576 || { echo "::error::包过小（$S 字节），提取未真正成功"; exit 1; }

      - name: 上传诊断（永远上传）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-diag
          path: |
            diag/report.md
            diag/inventory.tsv
          if-no-files-found: warn
          retention-days: 14

      - name: 上传工具链
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: unity-tools
          path: unity-tools.tar.gz
          if-no-files-found: error
          retention-days: 14
