# 从 Unity 官方安装包中提取「手机端可用的工具链」并做诊断
#
# 为什么要有这个文件：
#   手机（Android aarch64）解不开 Unity 的 NSIS 安装包（实测 7-Zip 26.03 识别格式但解不开，
#   unar 陷依赖地狱）。而 GitHub runner 是 x86_64 + 自带 7z，解压是一行的事。
#
# 这个工作流回答三个决定性问题：
#   ① Unity 的引用程序集（UnityEngine.*.dll）能不能拿到？—— 决定手机能否真编译 C#
#   ② il2cpp.exe 是【托管程序】还是【原生 PE】？—— 决定手机 .NET 8 能否直接跑 IL2CPP
#   ③ Android 模块里的 arm64 模板与 NDK sysroot 有哪些？—— 决定手机能否交叉编译出 .so
#
# 只上传「小而有价值」的部分，原始包（5.5GB）与解压全量（~9GB）一律不留。
name: extract-unity-tools

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-unity-tools.yml'

jobs:
  extract:
    name: 提取 Unity 工具链
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 只要 ~40GB 可用即可（下载 5.5GB + 解压 ~9GB）
      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - name: 下载两个 Unity 安装包（version 6000.3.25f1 / rev e1dba0a9aba4）
        run: |
          set -e
          mkdir -p dl
          B="https://download.unity3d.com/download_unity/e1dba0a9aba4"
          echo "== 编辑器本体 =="
          curl -fL --retry 3 --retry-delay 5 -o dl/editor.exe \
            "$B/Windows64EditorInstaller/UnitySetup64-6000.3.25f1.exe"
          echo "== Android 构建支持 =="
          curl -fL --retry 3 --retry-delay 5 -o dl/android.exe \
            "$B/TargetSupportInstaller/UnitySetup-Android-Support-for-Editor-6000.3.25f1.exe"
          ls -la dl/
          echo "编辑器 $(stat -c%s dl/editor.exe) 字节（应 4201959888）"
          echo "Android  $(stat -c%s dl/android.exe) 字节（应 1548575120）"

      - name: 解压（7z 对 NSIS）
        run: |
          mkdir -p out/editor out/android
          echo "== 编辑器 =="
          7z x -y -oout/editor dl/editor.exe > /tmp/7z-editor.log 2>&1 && echo "OK" || echo "7z 返回 $?（部分失败也可能已解出主体）"
          tail -5 /tmp/7z-editor.log
          echo "== Android 模块 =="
          7z x -y -oout/android dl/android.exe > /tmp/7z-android.log 2>&1 && echo "OK" || echo "7z 返回 $?（同上）"
          tail -5 /tmp/7z-android.log
          echo "== 解出规模 =="
          du -sh out/editor out/android 2>/dev/null || true

      - name: 诊断清单（决定性问题在这里回答）
        run: |
          set +e
          mkdir -p diag
          {
            echo "# Unity 安装包内容诊断"
            echo
            echo "## 一、解出的顶层结构"
            ls -la out/editor | head -40
            echo
            ls -la out/android | head -40
            echo
            echo "## 二、il2cpp 相关文件（决定性问题②）"
            find out -iname "*il2cpp*" -type f 2>/dev/null | head -60
            echo
            echo "### 逐个判定：托管 or 原生"
            find out -iname "*il2cpp*" -type f -size +100k 2>/dev/null | head -25 | while read f; do
              printf '%s\n  file: %s\n  size: %s\n' "$f" "$(file -b "$f")" "$(stat -c%s "$f")"
            done
            echo
            echo "## 三、引用程序集（决定性问题①）"
            find out -path "*Managed*" -name "*.dll" 2>/dev/null | head -60
            echo
            echo "Managed 目录下的 dll 总数:"
            find out -path "*Managed*" -name "*.dll" 2>/dev/null | wc -l
            echo
            echo "### UnityEngine 相关 dll 及大小"
            find out -path "*Managed*" -name "UnityEngine*.dll" 2>/dev/null | while read f; do
              printf '%12s  %s\n' "$(stat -c%s "$f")" "$f"
            done | head -40
            echo
            echo "## 四、Android 模块内容（决定性问题③）"
            echo "### PlaybackEngines"
            find out/android -maxdepth 6 -type d -name "*Android*" 2>/dev/null | head -20
            echo
            echo "### arm64 / arm64-v8a 模板 .so"
            find out -name "*.so" -path "*arm64*" 2>/dev/null | head -30
            echo
            echo "### NDK 线索（sysroot / clang / headers）"
            find out -maxdepth 6 -type d \( -name "sysroot" -o -name "toolchains" -o -name "ndk*" -o -name "NDK*" \) 2>/dev/null | head -20
            echo
            echo "### il2cpp 的 C++ 源码（libil2cpp）"
            find out -type d -name "libil2cpp" 2>/dev/null | head -10
            echo
            echo "## 五、体积分布（前 30 大目录）"
            du -h --max-depth=4 out 2>/dev/null | sort -rh | head -30
            echo
            echo "## 六、全量文件清单（路径 + 字节）"
            echo "见 inventory.tsv（同 artifact 内）"
          } > diag/report.md 2>&1
          # 机器可读清单
          find out -type f -printf '%s\t%p\n' 2>/dev/null | sort -rn > diag/inventory.tsv
          echo "report.md 行数: $(wc -l < diag/report.md)"
          echo "inventory.tsv 行数: $(wc -l < diag/inventory.tsv)"
          head -30 diag/report.md

      - name: 打包要带走的工具链
        run: |
          set +e
          mkdir -p ship
          # ① 引用程序集（编译 C# 用）—— 已压缩体积不大
          mkdir -p ship/managed
          find out -path "*Managed*" -name "*.dll" -exec cp --parents {} ship/managed/ \; 2>/dev/null
          du -sh ship/managed 2>/dev/null
          # ② il2cpp 工具（决定性问题②的实物）
          mkdir -p ship/il2cpp
          find out -iname "*il2cpp*" -type f -exec cp --parents {} ship/il2cpp/ \; 2>/dev/null
          du -sh ship/il2cpp 2>/dev/null
          # ③ Android 模块的 arm64 模板与 NDK（决定性问题③）
          mkdir -p ship/android
          find out/android -maxdepth 5 -type d 2>/dev/null | grep -iE "PlaybackEngines|Variations|Tools" | head -20 | while read d; do
            cp -r --parents "$d" ship/android/ 2>/dev/null
          done
          du -sh ship/android 2>/dev/null
          echo "== 汇总 =="
          du -sh ship/* 2>/dev/null
          tar -czf diag-ship.tar.gz -C ship . 2>/dev/null
          ls -la diag-ship.tar.gz 2>/dev/null

      - name: 上传诊断报告（永远上传，小）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-diag
          path: |
            diag/report.md
            diag/inventory.tsv
          if-no-files-found: warn
          retention-days: 14

      - name: 上传工具链包（若成功且不过大）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-tools
          path: diag-ship.tar.gz
          if-no-files-found: warn
          retention-days: 14
