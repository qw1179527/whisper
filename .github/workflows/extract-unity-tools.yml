# 从 Unity 官方发行物中提取「手机端可用的工具链」并做诊断
#
# ── 第一版为什么失败（必须记住的教训）────────────────────────────
#   第一版下的是 **Windows** 安装包（NSIS 格式），结果 7z **在 Linux runner 上同样解不开** ——
#   它只把 PE 解出来（out/editor/[0] = 4.2GB 的单块），Managed 目录 dll 数 = 0。
#   而我当时**误以为"手机解不开是 Android 的限制、CI 的 7z 能解"**，没先验证就搭了整个工作流。
#   修法不是换工具，而是**换发行物**：Unity 给 Linux 发的是纯 `TAR_XZ`，`tar` 直接解。
#   教训：**先验证源文件格式，再搭流水线**。
#
# ── 第二版为什么要加"硬判据"──────────────────────────────────
#   第一版 `7z x` 失败但被 `|| echo` 吞掉，工作流仍报 **success**，
#   产物 `unity-tools` 只有 306 字节（tar.gz 161 字节 = 空包）——典型的**假绿**。
#   本版在关键步骤后断言产物存在与非空，**不满足即 exit 1**。
name: extract-unity-tools

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-unity-tools.yml'

jobs:
  extract:
    name: 提取 Unity 工具链
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 释放磁盘空间（不动 tool-cache）
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - name: 装 libarchive-tools（bsdtar 读 .pkg/xar）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libarchive-tools xar || sudo apt-get install -y -qq libarchive-tools
          echo "bsdtar: $(bsdtar --version 2>&1 | head -1)"
          echo "xar   : $(which xar || echo '未装')"

      - name: 下载 Linux 编辑器 tarball（纯 tar.xz，4.2GB）
        run: |
          set -e
          mkdir -p dl
          B="https://download.unity3d.com/download_unity/e1dba0a9aba4"
          time curl -fL --retry 3 --retry-delay 5 -o dl/editor.tar.xz \
            "$B/LinuxEditorInstaller/Unity-6000.3.25f1.tar.xz"
          S=$(stat -c%s dl/editor.tar.xz)
          echo "下载 $S 字节（官方 4536554312）"
          test "$S" -eq 4536554312 || { echo "::error::体积不符"; exit 1; }

      - name: 解压 Linux 编辑器（只取需要的子树，省磁盘）
        run: |
          set -e
          mkdir -p out/editor
          # 全量解压约 8.7GB；只取工具链相关子树即可
          tar -xJf dl/editor.tar.xz -C out/editor \
            --wildcards 'Editor/Data/Managed/*' 'Editor/Data/Tools/*' \
                         'Editor/Data/il2cpp/*' 'Editor/Data/PlaybackEngines/*' \
                         'Editor/Data/NetStandard/*' 'Editor/Data/MonoBleedingEdge/*' 2>/dev/null || \
          tar -xJf dl/editor.tar.xz -C out/editor 2>/dev/null || true
          echo "== 解出规模 =="
          du -sh out/editor 2>/dev/null || echo "(空)"
          echo "== Managed dll 数 =="
          find out/editor -path "*Managed*" -name "*.dll" 2>/dev/null | wc -l

      - name: 下载 Linux 的 Android Build Support（.pkg / xar，2GB）
        run: |
          B="https://download.unity3d.com/download_unity/e1dba0a9aba4"
          curl -fL --retry 3 --retry-delay 5 -o dl/android.pkg \
            "$B/MacEditorTargetInstaller/UnitySetup-Android-Support-for-Editor-6000.3.25f1.pkg" || true
          ls -la dl/android.pkg 2>/dev/null || echo "(下载失败，继续)"

      - name: 解 Android 模块（多种工具都试，记录哪种有效）
        run: |
          mkdir -p out/android
          cd dl
          echo "== 文件类型 =="
          file android.pkg 2>/dev/null || true
          echo "== 尝试 1：bsdtar =="
          bsdtar -xf android.pkg -C ../out/android 2>&1 | head -3 && echo "bsdtar 成功" || echo "bsdtar 失败"
          echo "== 尝试 2：xar =="
          [ -d ../out/android/Payload ] || (xar -xf android.pkg -C ../out/android 2>&1 | head -3 && echo "xar 成功" || echo "xar 失败")
          echo "== 尝试 3：7z =="
          [ -d ../out/android/Payload ] || (7z x -y -o../out/android android.pkg >/dev/null 2>&1 && echo "7z 成功" || echo "7z 失败")
          cd ..
          echo "== 结果 =="
          du -sh out/android 2>/dev/null || echo "(空)"
          ls out/android 2>/dev/null | head -10

      - name: 诊断清单
        run: |
          set +e
          mkdir -p diag
          {
            echo "# Unity 工具链诊断（第二版：Linux 发行物）"
            echo
            echo "## ① 引用程序集"
            echo '```'
            find out -path "*Managed*" -name "*.dll" 2>/dev/null | head -40
            echo '```'
            echo "Managed dll 总数: $(find out -path '*Managed*' -name '*.dll' 2>/dev/null | wc -l)"
            echo
            echo "## ② il2cpp 实物（决定性问题②）"
            echo '```'
            find out -iname "*il2cpp*" -type f 2>/dev/null | head -40
            echo '```'
            echo "### 逐个判定托管 or 原生"
            echo '```'
            find out -iname "*il2cpp*" -type f -size +100k 2>/dev/null | head -20 | while read f; do
              printf '%s\n   %s\n   %s 字节\n' "$f" "$(file -b "$f")" "$(stat -c%s "$f")"
            done
            echo '```'
            echo
            echo "## ③ Android 模块内容"
            echo '```'
            find out/android -maxdepth 6 -type d 2>/dev/null | head -30
            echo '--- arm64 模板 .so ---'
            find out -name "*.so" -path "*arm64*" 2>/dev/null | head -20
            echo '--- libil2cpp 源码 ---'
            find out -type d -name "libil2cpp" 2>/dev/null | head -5
            echo '```'
            echo
            echo "## ④ 体积分布"
            echo '```'
            du -h --max-depth=3 out 2>/dev/null | sort -rh | head -25
            echo '```'
          } > diag/report.md 2>&1
          find out -type f -printf '%s\t%p\n' 2>/dev/null | sort -rn > diag/inventory.tsv
          echo "report.md $(wc -l < diag/report.md) 行 · inventory.tsv $(wc -l < diag/inventory.tsv) 行"
          sed -n '1,40p' diag/report.md

      # ── 硬判据：不满足就判红，绝不再出"成功但零产出"的假绿 ──
      - name: 硬判据（防假绿）
        run: |
          set -e
          DLLS=$(find out -path "*Managed*" -name "*.dll" 2>/dev/null | wc -l)
          IL2=$(find out -iname "*il2cpp*" -type f 2>/dev/null | wc -l)
          echo "Managed dll = $DLLS · il2cpp 文件 = $IL2"
          if [ "$DLLS" -eq 0 ]; then echo "::error::没拿到任何引用程序集（提取失败）"; exit 1; fi
          if [ "$IL2" -eq 0 ]; then echo "::error::没找到 il2cpp 工具（提取失败）"; exit 1; fi
          echo "✓ 硬判据通过"

      - name: 打包要带走的工具链
        run: |
          set -e
          mkdir -p ship
          find out -path "*Managed*" -name "*.dll" -exec cp --parents {} ship/ \; 2>/dev/null
          find out -iname "*il2cpp*" -type f -exec cp --parents {} ship/ \; 2>/dev/null
          for d in $(find out/android -maxdepth 4 -type d 2>/dev/null | head -30); do
            cp -r --parents "$d" ship/ 2>/dev/null || true
          done
          tar -czf unity-tools.tar.gz -C ship . 2>/dev/null
          S=$(stat -c%s unity-tools.tar.gz)
          echo "unity-tools.tar.gz = $S 字节"
          # 空包（< 100KB）说明打包也没拿到东西
          test "$S" -gt 102400 || { echo "::error::工具链包过小（$S 字节），提取未真正成功"; exit 1; }

      - name: 上传诊断（永远上传）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-diag
          path: |
            diag/report.md
            diag/inventory.tsv
          if-no-files-found: warn
          retention-days: 14

      - name: 上传工具链
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: unity-tools
          path: unity-tools.tar.gz
          if-no-files-found: error
          retention-days: 14
