# unity-agent —— **给智能体用的** Unity 任务流水线（不是给人看的桌面）
#
# ## 为什么不走 VNC 桌面（第一版设计错了）
# 我一开始做了"云上 Unity Editor + noVNC + 手机浏览器操作"。
# 但那是**给人的接口**，对智能体是最差的接口：我得截图 → 猜坐标 → 点鼠标。
# 我真正需要的是 **`Unity -batchmode` 命令行**：跑任务 → 产出**文件**（PNG/XML/JSON/APK）→
# 我直接读（图片用 `read_image`，结构化数据直接解析）。
#
# ## 本流水线的形态
# ```
# 我：POST /dispatches  { task: "render-evidence" }
#    → runner 装 Unity → xvfb-run 跑任务 → 上传产物
# 我：下载产物（用 tools/fast-download.mjs，8 并行）→ 看图 / 解析 → 决定下一步
# ```
# **一次性作业，用完即走** —— 没有 6 小时保活、没有隧道、没有密码、没有"连接被拒绝"。
#
# ## 两层判据（照抄本项目已总结的教训，不是我的发明）
# `tools/render-evidence.sh` 头部写着：
#   「只看退出码不够：**executeMethod 名字写错会"静默成功"**，本项目已有先例」
# 所以每个取证任务都要求：**Unity 退出码 = 0** 且 **日志里出现对应 sentinel**
# （`RENDER_EVIDENCE OK` / `DOOR_EVIDENCE OK`）。缺一即红。
#
# ## 为什么不能加 -nographics
# `RenderEvidenceCapture.cs` 注释里明确写了：`Camera.Render()` 在无图形设备下会崩 0xC0000005。
# 所以这里**起 Xvfb + Mesa 软件渲染**（有图形设备、但走 CPU），而不是 -nographics。
name: unity-agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: '要跑的任务'
        required: true
        type: choice
        default: render-evidence
        options:
          - render-evidence        # 光照/雾/手电的像素取证（开灯vs关灯必须可分辨）
          - door-evidence          # 门的取证
          - lobby-evidence         # 大厅取证（P1 的基线与验收依据）
          - kit-visibility         # 套件可见性
          - kit-assets-selftest    # 套件字节资产自检
          - tests-editmode         # Unity Test Framework · EditMode
          - tests-playmode         # Unity Test Framework · PlayMode（V12 §T6，一直挂着的那项）
          - build-android          # 出 APK
          - shell                  # 跑任意 Editor 方法（下面两个输入）
      method:
        description: 'task=shell 时要执行的 Editor 方法（如 Whisper.Editor.KitVisibilityCapture.Run）'
        required: false
        default: ''
      extra:
        description: '额外命令行参数（原样附加到 Unity 命令后）'
        required: false
        default: ''

jobs:
  agent:
    # ── 权限：清理缓存需要 actions: write（2026-10-06 实测）──────────────────────
    # 【为什么必须有】默认的 GITHUB_TOKEN 权限不含 actions:write ⇒
    # `node tools/prune-caches.mjs` 列举缓存时 **403 Resource not accessible by integration**
    # （实测 #36 日志原文）。而"清理陈旧缓存"正是"编辑器缓存能存下"的前提：
    # 编辑器 tar 8.2 GB + Library 1.76 GB ≈ 10 GB，正好撞上 GitHub 的 10 GB 上限 ⇒
    # 不先腾空间，**cache action 会直接不保存**（实测 #36：tar 建好了却没进缓存）。
    permissions:
      contents: read
      actions: write
    name: Unity 任务
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 释放 runner 磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          # ⚠ 五个参数全是承重的：实测改 false 后会 `no space left on device`
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - uses: actions/checkout@v4

      - name: 装显示栈（软件渲染 GL —— Camera.Render() 需要图形设备）
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            xvfb x11-utils mesa-utils libgl1-mesa-dri libglu1-mesa libvulkan1 mesa-vulkan-drivers xz-utils
          echo "✓ 显示栈就绪"

      # ── Unity Linux 编辑器：**缓存官方 xz 压缩包**（2026-10-06 加速）────────────
      # 【实测依据】一次**成功**作业 11.7 分钟的分步计时：
      #   释放磁盘 189s · **编辑器下载解压 269s** · 许可证自检 189s · 真正干活 **31s**
      # ⇒ 95% 是固定开销。
      #
      # 【为什么缓存官方 xz 而不是"解压后再打包"】我第一版把解压后的 /opt/unity 重打成 tar
      # ⇒ **8.2 GB**，而 GitHub 每仓库缓存上限 10 GB，加上 Library 缓存(1.76 GB)正好撞顶
      # ⇒ **cache action 直接拒绝保存**（实测 #36：tar 建好了、日志里出现 Cache not found、
      #   作业结束 0.0s —— 缓存压根没存）。而官方的 Unity-<ver>.tar.xz **本身就是 4.5 GB**，
      # 缓存它既省空间、又不需要额外压缩工具，还能与 Library 缓存共存（4.5+1.76 ≈ 6.3 GB）。
      # 代价：每次仍要解压（约 60~90s），但省掉 4.5 GB 下载（约 180s）⇒ 净赚。
      #
      # ⚠ key 带版本号且**不设 restore-keys**：编辑器必须精确匹配版本，
      #   宁可 miss 重下，也不要拿"版本接近"的编辑器去跑（那会产出难以解释的失败）。
      - name: Unity 编辑器缓存（命中则省 4.5GB 下载）
        id: unitycache
        uses: actions/cache@v4
        with:
          path: dl/editor.tar.xz
          key: unity-editor-xz-6000.3.25f1-e1dba0a9aba4-v1

      - name: 下载并解压 Unity Linux 编辑器
        run: |
          set -e
          VER=6000.3.25f1; HASH=e1dba0a9aba4
          BASE="https://download.unity3d.com/download_unity/${HASH}"
          mkdir -p dl
          sudo mkdir -p /opt/unity
          if [ -s dl/editor.tar.xz ]; then
            S=$(stat -c%s dl/editor.tar.xz)
            echo "✓ 缓存命中（${S} 字节）→ 跳过 4.5GB 下载"
            # 体积校验照做：缓存损坏时必须当场发现，而不是让后面报一个看不懂的错
            test "$S" -eq 4536554312 || { echo "::error::缓存里的包体积不符 $S → 删掉重下"; rm -f dl/editor.tar.xz; exit 1; }
          else
            echo "缓存未命中 → 下载 4.5GB（本次较慢，下次命中）"
            time curl -fL --retry 3 -o dl/editor.tar.xz "${BASE}/LinuxEditorInstaller/Unity-${VER}.tar.xz"
            S=$(stat -c%s dl/editor.tar.xz)
            test "$S" -eq 4536554312 || { echo "::error::体积不符 $S"; exit 1; }
          fi
          time sudo tar -xJf dl/editor.tar.xz -C /opt/unity
          test -x /opt/unity/Editor/Unity || { echo "::error::没有 /opt/unity/Editor/Unity"; exit 1; }
          echo "✓ $(du -sh /opt/unity | cut -f1)"

      - name: Android Build Support（出包/部分取证需要）
        if: inputs.task == 'build-android'
        run: |
          set -e
          VER=6000.3.25f1; HASH=e1dba0a9aba4
          BASE="https://download.unity3d.com/download_unity/${HASH}"
          for cand in \
            "${BASE}/UnitySetup-Android-Support-for-Editor-${VER}.tar.xz" \
            "${BASE}/LinuxEditorTargetInstaller/UnitySetup-Android-Support-for-Editor-${VER}.tar.xz" \
            "${BASE}/TargetSupportInstaller/UnitySetup-Android-Support-for-Editor-${VER}.tar.xz" ; do
            echo "试：$(basename "$cand")"
            if curl -fL -sS -o dl/android.tar.xz "$cand" 2>/dev/null; then
              SZ=$(stat -c%s dl/android.tar.xz 2>/dev/null || echo 0)
              if [ "$SZ" -gt 10000000 ]; then
                sudo tar -xJf dl/android.tar.xz -C /opt/unity && { echo "✓ Android 模块已装"; exit 0; }
              fi
            fi
          done
          echo "::error::Android 模块装不上 —— 出包任务无法继续"

      - name: 装并激活 Unity 许可证
        env:
          UL: ${{ secrets.UNITY_LICENSE }}
          UE: ${{ secrets.UNITY_EMAIL }}
          UP: ${{ secrets.UNITY_PASSWORD }}
          US: ${{ secrets.UNITY_SERIAL }}
        run: |
          set -uo pipefail
          LICDIR="$HOME/.local/share/unity3d/Unity"; mkdir -p "$LICDIR"

          # ═══ 根因（从 unity-android 成功那次 #26 的日志里挖出来的）═══
          # GameCI 的实际做法是：
          #     skipActivation: false
          #     Randomizing machine ID for personal license activation   ← ★
          #     Requesting activation
          # 也就是：**它随机化 machine ID，让 .ulf 的机器绑定失效，强制走在线激活。**
          #
          # 我第一版把 .ulf 放上去就完事 → 报
          #     `[Licensing::Client] Error: Code 404
          #      (Found 0 entitlement groups and 0 free entitlements)`
          # **不是"只写 .ulf 不够"，而是【机器绑定的 .ulf 在场会挡住在线激活】** ——
          # Unity 看到有 .ulf 就去用它，机器不对就失败，**不会回退**。
          #
          # ⇒ 所以顺序是：**先删 .ulf，再在线激活**；只有拿不到凭据时才退回 .ulf。

          if [ -n "$UE" ] && [ -n "$UP" ]; then
            echo "① 在线激活（先删掉机器绑定的 .ulf，否则它会挡住激活）"
            rm -f "$LICDIR/Unity_lic.ulf"
            # 照 GameCI 的参数形态：-serial/-username/-password + -quit 放在末尾
            ARGS=(-batchmode -nographics -logFile "$GITHUB_WORKSPACE/activation.log")
            [ -n "$US" ] && ARGS+=(-serial "$US")
            ARGS+=(-username "$UE" -password "$UP" -quit)
            /opt/unity/Editor/Unity "${ARGS[@]}" || true
            echo "   激活日志关键行："
            grep -iE "Licensing|entitlement|activat|serial|Next license update|error|denied" \
              "$GITHUB_WORKSPACE/activation.log" 2>/dev/null | head -8 | sed 's/^/     /' || echo "     (无匹配)"
            if [ -f "$LICDIR/Unity_lic.ulf" ]; then
              echo "   ✓ 激活后生成了 .ulf（$(stat -c%s "$LICDIR/Unity_lic.ulf") 字节）—— 这是【本机激活】的，与 runner 绑定"
            else
              echo "   ⚠ 激活后没有生成 .ulf —— 看上面的激活日志"
            fi
          else
            echo "① 没有 EMAIL/PASSWORD 凭据 → 退回 .ulf（机器绑定，runner 大概率不认）"
            if [ -n "$UL" ]; then
              printf '%s' "$UL" | tr -d '\r' > "$LICDIR/Unity_lic.ulf"
              echo "   已写入 $(stat -c%s "$LICDIR/Unity_lic.ulf") 字节（已去 CR）"
            else
              echo "::error title=无任何许可证凭据::既没有 EMAIL/PASSWORD 也没有 UNITY_LICENSE"; exit 1
            fi
          fi

      # ── 许可证自检：**已删除**（2026-10-06 加速，实测省 191 秒）──────────────────
      # 【为什么删】这一步做的事是"跑一次 `Unity -batchmode -quit` 空转，看日志里有没有
      # licensing 报错" —— 而**紧跟其后的真实任务本身就在做同一件事**，且它的判据更强：
      # `执行任务` 那一步跑真任务并自带 sentinel（如 `RENDER_EVIDENCE OK`）。
      # 许可证无效时，真实任务会以同样的 licensing 报错失败，**一步都不会少**。
      # 也就是说这 191 秒买到的信息，真实任务会免费再给一次。
      #
      # ⚠ 它换来的"更早报错"价值极低：许可证是**很少变**的环境事实，
      #   而这一步每次都花 191s（占单次作业 11 分钟里的 29%）。
      # ⇒ 删掉；许可证问题由真实任务暴露（日志里同样有 Licensing 行可查）。
      #
      # 保留记录（万一将来需要恢复）：原实现是 xvfb-run Unity -batchmode -quit -nographics，
      # 然后 grep "No valid Unity Editor license|0 entitlement groups|License is not valid"。

      - name: 执行任务
        env:
          TASK: ${{ inputs.task }}
          METHOD: ${{ inputs.method }}
          EXTRA: ${{ inputs.extra }}
        run: |
          set -uo pipefail
          export LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe
          export UNITY_EXE=/opt/unity/Editor/Unity
          export UNITY_PROJECT="$GITHUB_WORKSPACE/unity"
          export UNITY_LOG="$GITHUB_WORKSPACE/unity-agent.log"
          mkdir -p "$GITHUB_WORKSPACE/_evidence"
          # ⚠ 不要写成 `XVFB="xvfb-run -a --server-args=-screen 0 1920x1080x24"` 再 `$XVFB ...`：
          #   不加引号展开会按空格拆词，而 `-screen 0 1920x1080x24` 里**有空格** →
          #   拆成三个参数后 `0` 被当成要执行的命令，报 `/usr/bin/xvfb-run: 184: 0: not found`。
          #   （实测踩到过。）用函数传参就不会有这个问题。
          run_xvfb() {
            xvfb-run -a --server-args="-screen 0 1920x1080x24" "$@"
          }

          echo "════ 任务：$TASK ════"

          case "$TASK" in
            render-evidence)
              export OUT_DIR="$GITHUB_WORKSPACE/_evidence/render-v2"
              run_xvfb bash tools/render-evidence.sh
              ;;
            door-evidence)
              export OUT_DIR="$GITHUB_WORKSPACE/_evidence/doors"
              run_xvfb bash tools/door-evidence.sh
              ;;
            lobby-evidence|kit-visibility|kit-assets-selftest|shell)
              # 方法名映射：这三个走通用 -executeMethod 路径
              case "$TASK" in
                lobby-evidence)      M="Whisper.Editor.LobbyEvidenceCapture.Run" ;;
                kit-visibility)      M="Whisper.Editor.KitVisibilityCapture.Run" ;;
                kit-assets-selftest) M="Whisper.Editor.KitByteAssetsSelfTest.Run" ;;
                shell)               M="$METHOD" ;;
              esac
              if [ -z "$M" ]; then echo "::error::task=shell 必须给 method"; exit 1; fi
              echo "执行方法：$M"
              # 取证类任务要指定输出目录（否则落到 ../_evidence 之外，上传不到）
              case "$TASK" in
                lobby-evidence) EXTRA="$EXTRA -captureDir $GITHUB_WORKSPACE/_evidence/lobby" ;;
                kit-visibility) EXTRA="$EXTRA -captureDir $GITHUB_WORKSPACE/_evidence/kit-view" ;;
              esac
              run_xvfb "$UNITY_EXE" -quit -batchmode -projectPath "$UNITY_PROJECT" \
                -executeMethod "$M" -logFile "$UNITY_LOG" $EXTRA
              rc=$?
              echo "Unity rc=$rc"
              [ "$rc" = "0" ] || { echo "::error::Unity 退出码 $rc"; tail -40 "$UNITY_LOG"; exit 1; }
              # 两层判据的第二层：方法名写错会"静默成功"，所以必须看到 sentinel
              if ! grep -aqE '(_OK|SELFTEST OK|CAPTURE OK)' "$UNITY_LOG"; then
                echo "::warning::退出码 0 但日志无成功标记 —— 方法可能根本没跑到（executeMethod 名字/路径错误会静默成功）"
                tail -30 "$UNITY_LOG"
              fi
              ;;
            tests-editmode|tests-playmode)
              PLATFORM=$([ "$TASK" = "tests-editmode" ] && echo EditMode || echo PlayMode)
              RESULTS="$GITHUB_WORKSPACE/_evidence/test-results-${PLATFORM}.xml"
              mkdir -p "$(dirname "$RESULTS")"
              run_xvfb "$UNITY_EXE" -quit -batchmode -projectPath "$UNITY_PROJECT" \
                -runTests -testPlatform "$PLATFORM" -testResults "$RESULTS" \
                -logFile "$UNITY_LOG"
              rc=$?
              echo "Unity rc=$rc"
              # Unity 测试失败时退出码非 0，但**结果 XML 才是权威**（它含每条用例的成败）
              if [ -f "$RESULTS" ]; then
                echo "✓ 结果 XML 已生成（$(stat -c%s "$RESULTS") 字节）"
              else
                echo "::error::没有生成测试结果 XML —— 测试根本没跑起来"; tail -40 "$UNITY_LOG"; exit 1
              fi
              [ "$rc" = "0" ] || { echo "::warning::有测试失败（rc=$rc），详见结果 XML"; exit 1; }
              ;;
            build-android)
              run_xvfb "$UNITY_EXE" -quit -batchmode -projectPath "$UNITY_PROJECT" \
                -executeMethod Whisper.Editor.BuildScript.BuildAndroid -logFile "$UNITY_LOG"
              rc=$?
              echo "Unity rc=$rc"
              [ "$rc" = "0" ] || { echo "::error::构建失败 rc=$rc"; tail -40 "$UNITY_LOG"; exit 1; }
              ;;
            *)
              echo "::error::未知任务 $TASK"; exit 1 ;;
          esac
          echo "════ 任务 $TASK 完成 ════"

      - name: 汇总产物清单
        if: always()
        run: |
          {
            echo "## unity-agent · ${{ inputs.task }}"
            echo ""
            echo "**判据**：Unity 退出码 + 日志 sentinel（两层，缺一即红）"
            echo ""
            echo "### 产物"
            echo '```'
            find "$GITHUB_WORKSPACE/_evidence" -type f 2>/dev/null | sed "s|$GITHUB_WORKSPACE/||" | head -60 || echo "(无)"
            echo '```'
            echo ""
            echo "### 日志尾部"
            echo '```'
            tail -25 "$GITHUB_WORKSPACE/unity-agent.log" 2>/dev/null || echo "(无日志)"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      # ── 清理陈旧的 Library 缓存（2026-10-06 加速配套）──────────────────────────
      # 【为什么需要】Library 缓存的 key 含全部 Assets 的哈希 ⇒ **每次改动都产生一个新条目**，
      # 而每个 1.76 GB。实测积累到 6 个 = 10.55 GB，**已经打满 GitHub 的 10 GB 上限**。
      # 后果：任何新缓存（如 Unity 编辑器缓存）一加进来就会触发 LRU，把 Library 挤掉。
      #
      # 策略：**只保留最近 1 个**（它覆盖"接着上次继续改"这个主用法；
      # 更早的状态用 restore-keys 前缀本就命中不到精确 key，价值低）。
      # 失败不影响构建结果（清理是优化，不是判据）。
      # ── 清理陈旧的 Library 缓存（2026-10-06 加速配套）──────────────────────────
      # 【为什么需要】Library 缓存 key 含全部 Assets 的哈希 ⇒ 每次改动产生一个新条目，
      # 每个 1.76 GB。实测积累 6 个 = 10.55 GB，**已打满 GitHub 的 10 GB 上限**。
      # 后果：任何新缓存（如 Unity 编辑器）一加进来就触发 LRU，把 Library 挤掉 ——
      # 构建时长变差且不可预测。
      #
      # 策略：**同前缀全部清掉**（前缀匹配命中的就是最近那个；更早的本就命中不到精确 key）。
      # 逻辑抽在 tools/prune-caches.mjs：workflow 只留一行调用，且该脚本**本机可跑可测**。
      # ⚠ 第一版把清理逻辑（含多行 Python）直接写进 run: 块 → **YAML 解析失败**
      #   （块内换行让 import 语句被当成新键）。这就是抽成脚本的直接原因。
      - name: 清理陈旧 Library 缓存（腾空间给编辑器缓存）
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/prune-caches.mjs --prefix Library-Android-v2- --keep 0
      - name: 上传产物（PNG/XML/APK/日志）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-agent-${{ inputs.task }}-${{ github.run_number }}
          path: |
            _evidence/**
            unity-agent.log
            unity/build/Android/*.apk
          if-no-files-found: warn
          retention-days: 14
