# Project Whisper · Unity Android 构建（GameCI）
#
# 为什么要有这个文件：本机（Android/Termux 环境）**出不了 Unity 包** ——
#   ① Unity 官方发布索引里 Linux 编辑器只有 X86_64（实测最新 6000.3.25f1，4.2GB），
#      本机是 aarch64，需 box64/qemu 模拟；IL2CPP 编译在模拟下从"分钟级"变成"小时级"；
#   ② download.unity3d.com 对本区域返回 404（根路径同样 404，属区域拦截）；
#   ③ 本机可用于编译的内存约 6GB，Unity 编辑器 + IL2CPP 在这个量级上极易 OOM。
# 所以出包这一步交给 CI：推一次代码即产出 APK 工件。
#
# 需要配置的 Secrets（仓库 Settings → Secrets and variables → Actions）：
#   UNITY_LICENSE   —— Unity 个人版/专业版许可证（.ulf 内容；GameCI 文档有获取脚本）
#   UNITY_EMAIL     —— Unity 账号邮箱
#   UNITY_PASSWORD  —— Unity 账号密码
#   UNITY_SERIAL    —— 仅专业版需要（个人版留空）
#
# 详细获取方式见 https://game.ci/docs/unity/activation
name: unity-android

# ══════════════════════════════════════════════════════════════════════════════════
# 【2026-10-06 去掉 push 自动触发】出包是**发布动作**，不是**每次提交的动作**
# ══════════════════════════════════════════════════════════════════════════════════
# 实测证据（最近 100 次运行）：
#   · unity-android 共 81 次，其中 **73 次由 push 自动触发**
#   · 每次 **33 分钟**（"构建（GameCI）"一步就 1719s = 29 分钟）
#   · 累计 ~1403 分钟 —— 仓库建于 10-03、今天 10-06，**4 天烧掉免费额度的 70%**
#   · 与 unity-agent 的 ~505 分钟合计 **~2025 分钟 > 2000** ⇒ **整个仓库拿不到 runner**
#     （连只 echo 的最小探针作业都是 runner_id=0 / steps=0）
# ⇒ 我每改一个数值就 push ⇒ 每次重建一遍 APK。这个用法是错的：
#   · 反馈信号来自 unity-agent 的 sentinel（取证），**不是** APK 构建；
#   · 出包应在"要测/要发"时**显式派发**。
on:
  workflow_dispatch:
  # push:            ← 2026-10-06 移除。恢复前请先读上面这段实测。
  #   branches: [main]
  #   paths:
  #     - 'unity/**'
  #     - '.github/workflows/unity-android.yml'

jobs:
  build:
    name: 构建 Android APK
    runs-on: ubuntu-latest
    steps:
      # 先给出**可操作的报错**：缺许可证时 GitHub 的默认报错很难读懂（实测只提示
      # "Missing Unity License File"），这里直接把该做什么写清楚，避免来回试错。
      # GitHub 的 ubuntu runner 默认只剩 ~14GB，而 Unity 编辑器镜像解压后 8.7GB，
      # 实测会报 "failed to register layer: no space left on device"。
      # 这一步清掉 runner 预装但本项目用不到的大件（Android SDK/NDK、.NET、Haskell 等），
      # 腾出约 20~30GB —— 这是 GameCI 官方推荐的常规做法。
      - name: 释放 runner 磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          # ── 这五个参数**全是承重的**，别再"优化"掉（2026-10-05 实测教训）──────
          # 我曾把 tool-cache/haskell/large-packages 改成 false，理由是"收益小、耗时长"。
          # 结果 **#25 构建直接失败**：
          #   `docker: failed to register layer: write /opt/unity/Editor/.../BurstCache/…:
          #    no space left on device`
          # 清盘那一步确实从 3.2 分降到 1.8 分，但构建挂了 —— **得不偿失**。
          # 真相：这三个不是"顺手的开销"，而是**腾出空间的主要来源**。
          # Unity 镜像解压后 8.7GB，writer 层还要再翻一倍，20~30GB 是硬需求。
          # ⇒ **要动这组参数，必须先看下一步"诊断磁盘"打印的 GB 数**，别凭"看起来耗时"就删。
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      # 磁盘诊断：清盘参数是"腾够就好"还是"腾过头/腾不够"，**用数据判断而不是猜**。
      # 上一版注释说"不腾会 no space left"；本步打印腾出多少、够不够 Unity 镜像（解压 8.7GB）。
      - name: 诊断磁盘（清盘后）
        run: |
          echo "=== 清盘后可用空间 ==="
          df -h / | tail -1
          AVAIL=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "可用：${AVAIL} GB（Unity 镜像解压约需 8.7GB + Library 约 2GB）"
          if [ "${AVAIL:-0}" -lt 12 ]; then
            echo "::warning title=空间偏紧::清盘后仅 ${AVAIL} GB，构建可能 no space left —— 考虑恢复 tool-cache/haskell/large-packages"
          else
            echo "✓ 空间充足（${AVAIL} GB ≥ 12 GB）"
          fi

      - name: 检查 Unity 许可证 Secrets 是否已配置
        env:
          UL: ${{ secrets.UNITY_LICENSE }}
          UE: ${{ secrets.UNITY_EMAIL }}
          UP: ${{ secrets.UNITY_PASSWORD }}
          US: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [ -z "$UL" ] && [ -z "$US" ]; then
            echo "::error title=缺 Unity 许可证::未找到 UNITY_LICENSE（也没有 UNITY_SERIAL）。"
            echo "免费个人版没有纯网页路径 —— Unity 已废弃 .alf 上传流程，"
            echo "现要求用 **Unity Hub 桌面客户端**本地激活并取出 .ulf（GameCI v3 官方文档）："
            echo "  1) 在电脑（Win/Mac/Linux 任一）安装 Unity Hub: https://unity.com/download"
            echo "  2) 登录你的 Unity 账号 → Preferences > Licenses → Add → Get a free personal license"
            echo "  3) 找到 Unity_lic.ulf："
            echo "       Windows: C:\\ProgramData\\Unity\\Unity_lic.ulf"
            echo "       Mac:     /Library/Application Support/Unity/Unity_lic.ulf"
            echo "       Linux:   ~/.local/share/unity3d/Unity/Unity_lic.ulf"
            echo "  4) Settings → Secrets and variables → Actions 添加："
            echo "       UNITY_LICENSE  = .ulf 文件全文"
            echo "       UNITY_EMAIL    = Unity 账号邮箱"
            echo "       UNITY_PASSWORD = Unity 账号密码"
            exit 1
          fi
          echo "✓ 已检测到许可证凭据（UNITY_LICENSE 或 UNITY_SERIAL）"

      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: 缓存 Library
        uses: actions/cache@v4
        with:
          path: unity/Library
          # 缓存键必须包含 .meta 指纹：实测上次失败构建的 Library 与新补的 .meta 混用，
          # 会把错误从 181 条降到 46 条却不完全消失（旧程序集图残留）。改 meta 就该换缓存。
          key: Library-Android-v2-${{ hashFiles('unity/Assets/**', 'unity/ProjectSettings/**') }}
          restore-keys: Library-Android-v2-

      - name: 构建（GameCI）
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: unity
          targetPlatform: Android
          androidExportType: androidPackage
          buildMethod: Whisper.Editor.BuildScript.BuildAndroid
          allowDirtyBuild: true

      - name: 诊断：Unity 实际产出哪些程序集（无论成败）
        if: always()
        run: |
          echo "=== unity/Library/ScriptAssemblies 产出的 dll ==="
          ls -la unity/Library/ScriptAssemblies/ 2>/dev/null || echo "(目录不存在)"
          echo
          echo "=== 我们自己的程序集 dll（应有 Whisper.*.dll）==="
          ls unity/Library/ScriptAssemblies/Whisper.*.dll 2>/dev/null || echo "✗ 一个 Whisper.*.dll 都没有"
          echo
          echo "=== Bee 构建图里的程序集名 ==="
          ls unity/Library/Bee/artifacts/*/*.dag 2>/dev/null | head -5
          grep -oh '"Whisper\.[A-Za-z]*"' unity/Library/Bee/*.json 2>/dev/null | sort -u | head -20 || true
          echo
          echo "=== asmdef 是否被识别（查 Library 里的 asmdef 缓存）==="
          find unity/Library -name "*.asmdef" 2>/dev/null | head -5 || echo "(无)"
          echo
          echo "=== Assets 下 .meta 数量（应为 assets+folders 总数）==="
          find unity/Assets -name "*.meta" | wc -l

      # 抓 Bee 给 il2cpp 写的**响应文件**（手机端自出包路径 A 的关键拼图）。
      # 为什么需要：`il2cpp-compile` 在构建日志里 **0 次命中** —— Unity 不直接调它，
      # 而是由 `bee_backend --dagfile=...` 读 DAG、按其中的动作调它，**参数走 .rsp 响应文件**。
      # 要在手机上驱动它就必须知道那份 rsp 的格式，而它在 `Library/Bee/` 里、不进仓库也不进产物。
      # 这一步几乎零成本（就是 cp 几个小文件），但能把"猜格式"变成"看格式"。
      - name: 抓 il2cpp 的 Bee 响应文件与 DAG（路径 A 用）
        if: always()
        run: |
          mkdir -p il2cpp-probe
          echo "=== 1. Bee 下的响应文件清单 ===" | tee il2cpp-probe/summary.txt
          find unity/Library/Bee -name "*.rsp" -o -name "*.rsp2" 2>/dev/null | head -300 | tee -a il2cpp-probe/summary.txt
          echo | tee -a il2cpp-probe/summary.txt
          echo "=== 2. 内容里提到 il2cpp 的响应文件（真正要的那份）===" | tee -a il2cpp-probe/summary.txt
          grep -rl -i "il2cpp" unity/Library/Bee/artifacts --include="*.rsp" --include="*.rsp2" 2>/dev/null | head -30 | tee il2cpp-probe/il2cpp-rsp-paths.txt | tee -a il2cpp-probe/summary.txt
          while IFS= read -r f; do
            [ -f "$f" ] && cp "$f" "il2cpp-probe/$(echo "$f" | tr '/' '_')" 2>/dev/null
          done < il2cpp-probe/il2cpp-rsp-paths.txt
          echo | tee -a il2cpp-probe/summary.txt
          echo "=== 3. il2cpp 的 DAG（命令行在里面）===" | tee -a il2cpp-probe/summary.txt
          grep -rl -i "il2cpp" unity/Library/Bee --include="*.dag" --include="*.dag.json" 2>/dev/null | head -5 | tee -a il2cpp-probe/summary.txt
          for f in $(grep -rl -i "il2cpp" unity/Library/Bee --include="*.dag" --include="*.dag.json" 2>/dev/null | head -3); do
            [ -f "$f" ] && head -c 3000000 "$f" > "il2cpp-probe/$(basename "$f")" 2>/dev/null
          done
          echo | tee -a il2cpp-probe/summary.txt
          echo "=== 4. il2cpp 构建缓存目录 ===" | tee -a il2cpp-probe/summary.txt
          ls -la unity/Library/Il2cppBuildCache 2>/dev/null | head -20 | tee -a il2cpp-probe/summary.txt || echo "(无)" | tee -a il2cpp-probe/summary.txt
          echo | tee -a il2cpp-probe/summary.txt
          echo "=== 体积 ===" | tee -a il2cpp-probe/summary.txt
          du -sh il2cpp-probe | tee -a il2cpp-probe/summary.txt

      - name: 上传 il2cpp 探针（路径 A 用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: il2cpp-probe
          path: il2cpp-probe/
          if-no-files-found: warn
          retention-days: 14

      - name: 上传 APK 工件
        uses: actions/upload-artifact@v4
        with:
          name: whisper-android-apk
          # 注意路径前缀 unity/：BuildScript 用 Directory.GetCurrentDirectory()，
          # 而 GameCI 以 projectPath(unity/) 为工作目录 → 产物落在 unity/build/Android/
          path: unity/build/Android/*.apk
          if-no-files-found: error

      - name: 记录包体（**无上限判据**）
        # 【已取消 200MB 硬门禁 · 用户 2026-10-06】原文："并非有200MB上限，把 pdf 方案里的所有要求全部抛弃"
        # 保留这一步是因为**包体数字本身有信息量**（构建产物在变大还是变小），
        # 但它不再能让构建失败 —— 高画质方向下包体必然上升，拿条文卡死等于堵死画质目标。
        run: |
          set -e
          f=$(ls unity/build/Android/*.apk 2>/dev/null | head -1)
          if [ -z "$f" ]; then echo "::error::没有 APK 产物"; exit 1; fi
          sz=$(stat -c%s "$f")
          echo "APK: $f"
          echo "大小: $sz 字节 = $(awk "BEGIN{printf \"%.1f\", $sz/1048576}") MB（仅记录，不判红）"
