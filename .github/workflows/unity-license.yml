# Project Whisper · 用序列号激活 Unity（CI 侧）
#
# 背景链（每一步都是实测结论）：
#  ① 云端用 -username/-password 激活：能登录，但返回 "0 entitlements"（账号无授权）
#  ② 电脑端 Hub 激活后拿到 .ulf，但它是 <License id="Terms"> + MachineBindings，
#     绑定本机机器码 → 在 CI runner 上无效
#  ③ 但 .ulf 里藏有完整序列号（SerialMasked 被掩码，DeveloperData 的 base64 里是明文）
#     → 解出 F4-WU6R-BA2X-RPYN-22M3-9CPX，这是个人版序列号
#  ④ 序列号激活不受机器绑定限制，是 CI 的正路（GameCI 文档：pro 用 UNITY_SERIAL；
#     个人版序列号同样可用）
#
# 注意：序列号若已在别处激活，需要先在那台机器 "Return license"（Hub 里可点）。
name: unity-license

on:
  workflow_dispatch:

jobs:
  activate:
    name: 序列号激活
    runs-on: ubuntu-latest
    steps:
      - name: 校验凭据
        env:
          UE: ${{ secrets.UNITY_EMAIL }}
          UP: ${{ secrets.UNITY_PASSWORD }}
          US: ${{ secrets.UNITY_SERIAL }}
        run: |
          [ -n "$UE" ] && [ -n "$UP" ] || { echo "::error title=缺凭据::需要 UNITY_EMAIL / UNITY_PASSWORD"; exit 1; }
          [ -n "$US" ] && echo "✓ 序列号已配置（${US:0:2}***）" || echo "⚠ 无序列号，将仅用账号凭据"

      - uses: actions/checkout@v4

      - name: 释放 runner 磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - name: 用序列号激活（GameCI 官方动作）
        uses: game-ci/unity-activate@v2
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}

      - name: 收集 .ulf
        id: find
        run: |
          set -e
          echo "--- 搜索 .ulf ---"
          find / -name "*.ulf" -not -path "/proc/*" 2>/dev/null | head -5 || true
          ULF=$(find / -name "Unity_lic.ulf" -not -path "/proc/*" 2>/dev/null | head -1 || true)
          if [ -n "$ULF" ]; then cp "$ULF" ./Unity_lic.ulf; echo "found=1" >> "$GITHUB_OUTPUT"; echo "✓ $ULF";
          else echo "found=0" >> "$GITHUB_OUTPUT"; echo "✗ 未找到 .ulf"; fi

      - name: 上传 .ulf
        if: steps.find.outputs.found == '1'
        uses: actions/upload-artifact@v4
        with:
          name: unity-license-ulf
          path: Unity_lic.ulf
          retention-days: 7
