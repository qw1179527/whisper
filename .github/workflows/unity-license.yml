# Project Whisper · 自动获取 Unity 个人版许可证
#
# 背景：Unity 官方要求个人版必须用 Unity Hub 桌面端激活，而本项目在 Android 手机上开发，
# 没有桌面端。GameCI 提供了官方的命令行激活动作 game-ci/unity-activate，
# 它支持 personal license 并直接接受账号凭据 —— 不需要本地 Hub。
#
# 曾用方案（已废弃）：game-ci/unity-license-activate（浏览器自动化）
#   实测失败：waiting for selector `#new_conversations_create_session_form ..._password` timeout
#   —— 该工具硬编码了 Unity 旧登录页的选择器，页面改版后就失效了。
#
# 需要 2 个 Secret：UNITY_EMAIL / UNITY_PASSWORD（已配置）
name: unity-license

on:
  workflow_dispatch:

jobs:
  acquire:
    name: 激活 Unity 个人版许可证
    runs-on: ubuntu-latest
    steps:
      - name: 校验凭据
        env:
          UE: ${{ secrets.UNITY_EMAIL }}
          UP: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UE" ] || [ -z "$UP" ]; then
            echo "::error title=缺 Unity 账号::请添加 UNITY_EMAIL 与 UNITY_PASSWORD"
            exit 1
          fi
          echo "✓ 已检测到凭据（邮箱 ${UE:0:3}***）"

      - uses: actions/checkout@v4

      - name: 释放 runner 磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - name: 用账号凭据激活许可证（GameCI 官方动作）
        uses: game-ci/unity-activate@v2
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: 6000.3.25f1

      - name: 收集 .ulf（若生成）
        run: |
          set -e
          echo "--- 查找许可证文件 ---"
          find / -name "*.ulf" -not -path "*/proc/*" 2>/dev/null | head -10 || true
          ULF=$(find / -name "Unity_lic.ulf" -not -path "*/proc/*" 2>/dev/null | head -1 || true)
          if [ -n "$ULF" ]; then
            cp "$ULF" ./Unity_lic.ulf
            echo "✓ 取到 $ULF"
          else
            echo "::warning title=未取到 .ulf::激活可能已写入缓存，见上方日志"
          fi

      - name: 上传 .ulf（如有）
        if: hashFiles('Unity_lic.ulf') != ''
        uses: actions/upload-artifact@v4
        with:
          name: unity-license-ulf
          path: Unity_lic.ulf
          retention-days: 7
